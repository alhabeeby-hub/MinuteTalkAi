# MinuteTalk AI - Amplify Cloud Build Configuration (FRONTEND ONLY)
#
# This file configures how AWS Amplify builds and hosts the React frontend.
#
# NOTE: The backend (FastAPI + Lambda + API Gateway) is NOT built here. It is
# deployed separately with CDK — see DEPLOYMENT.md. Amplify Hosting only runs
# the `frontend` phases below.
#
# For more info: https://docs.aws.amazon.com/amplify/latest/userguide/build-settings.html

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
