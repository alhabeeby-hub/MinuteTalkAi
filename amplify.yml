# MinuteTalk AI - Amplify Cloud Build Configuration
#
# This file configures how AWS Amplify builds and deploys the application.
# It handles both the frontend (React) and backend (Python Lambda) deployments.
#
# Build Phases:
# 1. frontend: Install and build the React app
# 2. backend: Install Python dependencies for Lambda
#
# For more info: https://docs.amplify.aws/cli/teams/overview/

version: 1
frontend:
  phases:
    # ==========================================
    # Frontend Build (React + Vite)
    # ==========================================
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*

# Backend build phase - runs after frontend
# This packages the Python Lambda function
backend:
  phases:
    build:
      commands:
        # Create deployment package for Lambda
        - echo "Building Lambda function package..."
        - cd backend
        - pip install --upgrade pip
        - pip install -r requirements.txt -t ./package
        - cp -r app ./package/
        - cd package
        - zip -r ../deployment.zip .
        - echo "Lambda package created successfully"
        # Deploy backend stack via CDK
        - cd ../../amplify
        - npm ci
        - npm run build
        - npx cdk deploy --require-approval never
  artifacts:
    baseDirectory: backend
    files:
      - 'deployment.zip'
    # Override the default packaging - we handle it ourselves
    packege: |
      cd backend
      pip install -r requirements.txt -t ./package
      cp -r app ./package/
      cd package
      zip -r ../deployment.zip .

# Settings for environment variables
# Add your GROQ_API_KEY in the Amplify Console
env:
  variables:
    # Frontend environment variables
    VITE_API_URL: ''  # Will be set by Amplify post-backend-build
    
    # Backend environment variables  
    GROQ_API_KEY: ''  # Set in Amplify Console
